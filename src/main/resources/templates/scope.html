<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Select Permissions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg border-0 rounded-4 p-4"
         style="max-width:450px; width:100%;">

        <div th:if="${provider == 'google'}">

            <h3 class="text-center mb-4">
                Select Google Permissions
            </h3>

            <form action="/select-scope" method="post">

                <div class="form-check mb-3">

                    <input class="form-check-input"
                           type="checkbox"
                           name="scope"
                           value="openid"
                           checked="checked">

                    <label class="form-check-label">
                        OpenID
                    </label>

                </div>


                <div class="form-check mb-3">

                    <input class="form-check-input"
                           type="checkbox"
                           name="scope"
                           value="email"
                           checked="checked">

                    <label class="form-check-label">
                        Email
                    </label>

                </div>


                <div class="form-check mb-3">

                    <input class="form-check-input"
                           type="checkbox"
                           name="scope"
                           value="profile">

                    <label class="form-check-label">
                        Profile
                    </label>

                </div>
         <div class="form-check mb-3">
        <input class="form-check-input"
               type="checkbox"
               name="scope"
               value="https://www.googleapis.com/auth/drive.readonly">
        <label class="form-check-label">
            Google Drive — Read your files
        </label>
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input"
               type="checkbox"
               name="scope"
               value="https://www.googleapis.com/auth/contacts.readonly">
        <label class="form-check-label">
             Contacts — Read your contacts
        </label>
    </div>

                <button type="submit"
                        class="btn btn-primary w-100">

                    Continue with Google

                </button>

            </form>

        </div>


        <!-- GITHUB -->

        <div th:if="${provider == 'github'}">

            <h3 class="text-center mb-4">
                Select GitHub Permissions
            </h3>

            <form action="/select-scope" method="post">

                <div class="form-check mb-3">

                    <input class="form-check-input"
                           type="checkbox"
                           name="scope"
                           value="read:user">

                    <label class="form-check-label">

                        Read user profile

                    </label>

                </div>


                <div class="form-check mb-3">

                    <input class="form-check-input"
                           type="checkbox"
                           name="scope"
                           value="user:email">

                    <label class="form-check-label">

                        Read email address

                    </label>

                </div>
                   <div class="form-check mb-3">

            <input class="form-check-input"
                   type="checkbox"
                   name="scope"
                   value="public_repo">

            <label class="form-check-label">
                Public Repositories
            </label>

        </div>
                


                <button type="submit"
                        class="btn btn-dark w-100">

                    Continue with GitHub

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
